<ion-content [fullscreen]="true" class="app-content"><main class="page free-play"><p class="overline">{{ i18n.t('freePlay') }}</p><h1>{{ i18n.t('freePlayTitle') }}</h1><p class="intro">{{ i18n.t('freePlayIntro') }}</p><section class="settings-group"><label class="setting-row"><span><b>{{ i18n.t('exercise') }}</b><small>{{ i18n.t('freePlayExerciseHelp') }}</small></span><ion-select [value]="type" interface="popover" (ionChange)="type = $event.detail.value">@for (exercise of exercises; track exercise.id) { <ion-select-option [value]="exercise.id">{{ title(exercise.id) }}</ion-select-option> }</ion-select></label><label class="setting-row"><span><b>{{ i18n.t('level') }}</b><small>{{ i18n.t('freePlayLevelHelp') }}</small></span><ion-select [value]="level" interface="popover" (ionChange)="level = $event.detail.value">@for (item of levels; track item) { <ion-select-option [value]="item">{{ item }}</ion-select-option> }</ion-select></label></section><div class="free-record"><span>✦</span><div><small>{{ i18n.t('bestRecord') }}</small><b>{{ record() }} {{ i18n.t('inARow') }}</b></div></div><button class="primary" (click)="start()">{{ i18n.t('startFreePlay') }} <span>→</span></button></main></ion-content>
