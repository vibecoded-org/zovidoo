<ion-content [fullscreen]="true" class="app-content">
  <main class="page settings">
    <p class="overline">{{ i18n.t('brandTag') }}</p><h1>{{ i18n.t('settingsTitle') }}</h1>
    <section class="settings-group"><h2>{{ i18n.t('appearance') }}</h2><label class="setting-row"><span><b>{{ i18n.t('language') }}</b><small>{{ i18n.t('languageHint') }}</small></span><app-language-selector [compact]="true" /></label></section>
    <section class="settings-group"><h2>{{ i18n.t('practiceGroup') }}</h2><label class="setting-row"><span><b>{{ i18n.t('dailyGoal') }}</b><small>{{ i18n.t('dailyGoalHelp') }}</small></span><ion-select [value]="storage.settings().dailyGoal" interface="popover" (ionChange)="updateGoal($event.detail.value)">@for (goal of [5,10,15,20,30]; track goal) { <ion-select-option [value]="goal">{{ goal }}</ion-select-option> }</ion-select></label><label class="setting-row"><span><b>{{ i18n.t('instrument') }}</b><small>{{ i18n.t('instrumentHelp') }}</small></span><ion-select [value]="storage.settings().instrument" interface="popover" (ionChange)="updateInstrument($event.detail.value)"><ion-select-option value="piano">{{ i18n.t('piano') }}</ion-select-option><ion-select-option value="acoustic-guitar">{{ i18n.t('acousticGuitar') }}</ion-select-option><ion-select-option value="electric-piano">{{ i18n.t('electricPiano') }}</ion-select-option><ion-select-option value="organ">{{ i18n.t('organ') }}</ion-select-option><ion-select-option value="vibraphone">{{ i18n.t('vibraphone') }}</ion-select-option><ion-select-option value="warm-pad">{{ i18n.t('warmPad') }}</ion-select-option><ion-select-option value="marimba">{{ i18n.t('marimba') }}</ion-select-option><ion-select-option value="random">{{ i18n.t('random') }}</ion-select-option></ion-select></label></section>
    <section class="settings-group"><h2>{{ i18n.t('reminders') }}</h2><label class="setting-row"><span><b>{{ i18n.t('dailyReminder') }}</b><small>{{ i18n.t(notifications.supported() ? 'reminderOpenOnly' : 'unavailable') }}</small></span><ion-toggle [checked]="storage.settings().dailyReminder.enabled" (ionChange)="dailyChange($event.detail.checked)"></ion-toggle></label><label class="setting-row" [class.disabled]="!storage.settings().dailyReminder.enabled"><span><b>{{ i18n.t('reminderTime') }}</b><small>{{ i18n.t('localTime') }}</small></span><ion-input type="time" [value]="storage.settings().dailyReminder.time" (ionChange)="updateReminderTime($any($event.target).value)"></ion-input></label></section>
    <section class="settings-group"><h2>{{ i18n.t('data') }}</h2><button class="setting-row action" (click)="download()"><span><b>{{ i18n.t('exportData') }}</b><small>{{ i18n.t('downloadBackup') }}</small></span><em>↓</em></button><label class="setting-row action"><span><b>{{ i18n.t('importData') }}</b><small>{{ i18n.t('restoreBackup') }}</small></span><em>↑</em><input type="file" accept="application/json" (change)="importFile($event)"></label><button class="setting-row action danger" (click)="reset()"><span><b>{{ i18n.t('resetData') }}</b><small>{{ i18n.t('resetHelp') }}</small></span><em>×</em></button>@if (importMessage) { <p class="message">{{ importMessage }}</p> }</section>
    <p class="privacy">{{ i18n.t('privacy') }}</p>
  </main>
</ion-content>
