<ion-content [fullscreen]="true" class="app-content"><main class="page practice"><p class="overline">{{ i18n.t('practiceLab') }}</p><h1>{{ i18n.t('practiceTitle') }}</h1><p class="intro">{{ i18n.t('practiceIntro') }}</p><button class="quick" (click)="quick()"><div class="spark">✦</div><div><span>{{ i18n.t('quickPractice') }}</span><b>{{ i18n.t('surprise') }}</b><small>{{ i18n.t('quickSubtitle') }}</small></div><em>→</em></button><h2>{{ i18n.t('explore') }}</h2>@for (exercise of exercises; track exercise.id) { <button class="exercise-card" (click)="open(exercise.id)"><span class="exercise-icon">{{ exercise.icon }}</span><span class="exercise-copy"><b>{{ title(exercise.id) }}</b><small>{{ description(exercise.id) }}</small><i>{{ difficulty(exercise.id) }}</i></span><em>›</em></button> }</main></ion-content>
