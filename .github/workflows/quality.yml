name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test -- --watch=false --browsers=ChromeHeadless
      - run: bun run build -- --base-href /zovidoo/
      - run: cp www/index.html www/404.html
      - run: ./scripts/verify-pages-build.sh www /zovidoo/
